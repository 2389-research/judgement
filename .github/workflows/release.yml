# ABOUTME: Builds tagged Judgement releases for macOS and Linux with GoReleaser.
# ABOUTME: Publishes archives and checksums, then updates the organization Homebrew tap.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Identify stable release
        id: release-kind
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          case "${TAG_NAME%%+*}" in
            *-*) echo 'stable=false' >> "$GITHUB_OUTPUT" ;;
            *) echo 'stable=true' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Validate tap credential
        if: steps.release-kind.outputs.stable == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ': "${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is required}"'

      - name: Test
        run: go test -race -count=1 ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing and Apple notarization for the macOS binaries.
          # GoReleaser skips notarization when MACOS_SIGN_P12 is unset.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Generate Homebrew cask
        if: steps.release-kind.outputs.stable == 'true'
        run: go run ./internal/cmd/homebrew-cask --dist dist > "$RUNNER_TEMP/judgement.rb"

      - name: Check out Homebrew tap
        if: steps.release-kind.outputs.stable == 'true'
        uses: actions/checkout@v7
        with:
          repository: 2389-research/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew cask
        if: steps.release-kind.outputs.stable == 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p homebrew-tap/Casks
          cp "$RUNNER_TEMP/judgement.rb" homebrew-tap/Casks/judgement.rb
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Retire the formula the earlier release left behind; judgement now ships as a cask.
          git -C homebrew-tap rm --ignore-unmatch --quiet Formula/judgement.rb
          git -C homebrew-tap add Casks/judgement.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "Update judgement to $TAG_NAME"
            git -C homebrew-tap push
          fi
